name: Add to leaderboard
# A maintainer adds the "leaderboard" label to a graded Model test issue.
# Only people with triage or write access can label issues, so nobody else can
# put entries on the board. The issue text is re-graded here; it is only data.
on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  add:
    if: github.event.label.name == 'leaderboard' && startsWith(github.event.issue.title, '[Model test]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify grading engine
        run: python -m unittest discover -s tests -v
        working-directory: src
      - name: Grade the issue and update the board
        id: board
        run: python src/leaderboard.py --event "$GITHUB_EVENT_PATH"
      - name: Commit the board
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/leaderboard/leaderboard.json LEADERBOARD.md
          if git diff --cached --quiet; then echo 'Board unchanged.'; exit 0; fi
          git commit -m "Leaderboard: add issue #${ISSUE_NUMBER}"
          git push
      - name: Confirm on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Added to the [leaderboard](https://github.com/${GITHUB_REPOSITORY}/blob/HEAD/LEADERBOARD.md)."
